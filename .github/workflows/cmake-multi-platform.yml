name: Compilar Plugins VST3

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Descargar repositorio
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Configurar CMake
      run: cmake -B build -S CRIS_AUDIO_SUITE -DCMAKE_BUILD_TYPE=Release

    - name: Compilar Plugins
      run: cmake --build build --config Release

    - name: Recolectar archivos compilados
      shell: pwsh
      run: |
        New-Item -ItemType Directory -Force -Path salida_plugins
        Get-ChildItem -Path build -Include .vst3,.dll,*.exe -Recurse | Copy-Item -Destination salida_plugins -Recurse -Force -ErrorAction SilentlyContinue
        if (Test-Path "C:\Program Files\Common Files\VST3") {
          Get-ChildItem -Path "C:\Program Files\Common Files\VST3" -Filter "*.vst3" -Recurse | Copy-Item -Destination salida_plugins -Recurse -Force -ErrorAction SilentlyContinue
        }
        Get-ChildItem -Path salida_plugins -Recurse

    - name: Empaquetar archivos
      uses: actions/upload-artifact@v4
      with:
        name: Cris-Audio-Suite-Compilado
        path: salida_plugins/
