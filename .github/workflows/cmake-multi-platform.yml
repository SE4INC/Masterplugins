name: Compilar Plugins VST3

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Descargar repositorio
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Configurar CMake
      run: cmake -B build -S CRIS_AUDIO_SUITE -DCMAKE_BUILD_TYPE=Release

    - name: Compilar Plugins
      run: cmake --build build --config Release

    - name: Empaquetar archivos VST3
      uses: actions/upload-artifact@v4
      with:
        name: Cris-Audio-Suite-VST3
        path: build/*/.vst3
