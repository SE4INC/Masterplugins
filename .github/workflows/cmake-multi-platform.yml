name: Compilar Plugins VST3

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Descargar repositorio
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Configurar CMake
      run: cmake -B build -S CRIS_AUDIO_SUITE -DCMAKE_BUILD_TYPE=Release

    - name: Compilar Plugins
      run: cmake --build build --config Release

    - name: Recolectar archivos compilados
      shell: pwsh
      run: |
        New-Item -ItemType Directory -Force -Path salida_plugins
        Get-ChildItem -Path build -Directory -Filter ".vst3" -Recurse | Where-Object { $_.FullName -notlike "\.vst3\*" } | Copy-Item -Destination salida_plugins -Recurse -Force
    - name: Empaquetar archivos
      uses: actions/upload-artifact@v4
      with:
        name: Cris-Audio-Suite-Compilado
        path: salida_plugins/
